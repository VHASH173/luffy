<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login · LUFFY LUXE STORE</title>
  <link rel="shortcut icon" href="/logosrevis.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      color: #fff;
      background:
        radial-gradient(circle at top left, rgba(227, 0, 0, 0.16), transparent 28%),
        radial-gradient(circle at top right, rgba(59, 130, 246, 0.14), transparent 24%),
        linear-gradient(180deg, #090b16 0%, #05070d 100%);
    }
    .card {
      width: 100%;
      max-width: 400px;
      border-radius: 28px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      background: linear-gradient(180deg, rgba(8, 12, 22, 0.92), rgba(5, 10, 18, 0.84));
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.34);
      padding: 32px;
      backdrop-filter: blur(16px);
    }
    .brand {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }
    .brand .logo {
      width: 56px;
      height: 56px;
      border-radius: 999px;
      border: 3px solid rgba(239, 68, 68, 0.82);
      object-fit: cover;
    }
    .brand .text {
      height: auto;
      object-fit: contain;
    }
    h1 { font-size: 1.6rem; text-align: center; margin-bottom: 4px; }
    .subtitle { color: #cbd5e1; font-size: 0.9rem; text-align: center; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    label { font-size: 0.85rem; color: #93c5fd; font-weight: 700; display: block; margin-bottom: 8px; }
    input {
      width: 100%;
      border-radius: 16px;
      border: 1px solid rgba(96, 165, 250, 0.18);
      background: rgba(15, 23, 42, 0.72);
      color: #fff;
      padding: 14px 16px;
      outline: none;
      font-size: 1rem;
    }
    .btn {
      width: 100%;
      border: 0;
      cursor: pointer;
      color: #fff;
      padding: 14px 16px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 1rem;
      margin-top: 8px;
    }
    .btn.primary { background: linear-gradient(135deg, #2563eb, #4f46e5); }
    .btn.danger { background: linear-gradient(135deg, #dc2626, #ea580c); }
    .status { margin-top: 12px; text-align: center; font-size: 0.85rem; }
    .success { color: #86efac; }
    .error { color: #fca5a5; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: #93c5fd;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back-link:hover { text-decoration: underline; }
    .loader { display: none; margin: 16px auto; width: 32px; height: 32px; border: 4px solid rgba(96,165,250,0.2); border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img class="logo" src="/logosrevis.png" alt="LUFFY LUXE STORE" />
      <img class="text" src="/generated_textX.png" alt="PANEL ADMIN" />
    </div>
    <h1>Acceso Admin</h1>
    <p class="subtitle">Inicia sesión para subir y gestionar productos</p>
    <form id="adminLoginForm">
      <div class="field">
        <label for="emailuser">Correo electrónico de administrador</label>
        <input id="emailuser" type="email" placeholder="Tu correo admin" required />
      </div>
      <div class="field">
        <label for="showpassword">Contraseña</label>
        <input id="showpassword" type="password" placeholder="Tu contraseña" required />
      </div>
      <button class="btn primary" type="submit">Entrar al Panel</button>
      <div class="loader" id="loader"></div>
      <p class="status" id="loginStatus"></p>
    </form>
    <a class="back-link" href="/">Volver al inicio</a>
  </div>

  <script>
    (() => {
      const $ = (s) => document.querySelector(s);
      const form = $("#adminLoginForm");
      const status = $("#loginStatus");
      const loader = $("#loader");

      async function postJSON(url, body) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);
        try {
          const r = await fetch(url, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
            signal: controller.signal,
          });
          return await r.json();
        } catch (err) {
          if (err && err.name === "AbortError") {
            throw new Error("El servidor tardó demasiado. Intenta otra vez.");
          }
          throw err;
        } finally {
          clearTimeout(timeoutId);
        }
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        status.textContent = "";
        status.className = "status";
        loader.style.display = "block";
        const btn = form.querySelector("button[type=submit]");
        btn.disabled = true;
        try {
          const data = await postJSON("/secure/login", {
            emailuser: $("#emailuser").value.trim(),
            showpassword: $("#showpassword").value.trim(),
          });
          if (data.status === "success") {
            status.textContent = "Acceso correcto. Entrando...";
            status.className = "status success";
            setTimeout(() => { location.href = "/admin.html"; }, 1500);
          } else {
            status.textContent = data.message || "Credenciales incorrectas";
            status.className = "status error";
          }
        } catch (err) {
          status.textContent = err.message || "No se pudo iniciar sesión";
          status.className = "status error";
        } finally {
          loader.style.display = "none";
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
