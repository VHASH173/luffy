<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Perfil · LUFFY LUXE STORE</title>
  <link rel="shortcut icon" href="/logosrevis.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", sans-serif; }
    body {
      min-height: 100vh;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(227,0,0,.18), transparent 28%),
        radial-gradient(circle at top right, rgba(59,130,246,.14), transparent 24%),
        linear-gradient(180deg, #090b16 0%, #05070d 100%);
      color: #fff;
    }
    .perfil-shell {
      width: min(100%, 980px);
      margin: 0 auto;
      display: grid;
      gap: 22px;
    }
    .perfil-topbar,
    .perfil-card,
    .perfil-panel {
      border-radius: 30px;
      border: 1px solid rgba(148,163,184,.16);
      background: linear-gradient(180deg, rgba(8,12,22,.90), rgba(5,10,18,.84));
      box-shadow: 0 24px 60px rgba(0,0,0,.34);
      backdrop-filter: blur(16px);
    }
    .perfil-topbar {
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .perfil-brandbox {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .perfil-logo {
      width: 76px;
      height: 76px;
      object-fit: cover;
      border-radius: 999px;
      border: 3px solid rgba(227,0,0,.88);
      box-shadow: 0 0 24px rgba(227,0,0,.25);
      flex: 0 0 auto;
    }
    .perfil-brandtext {
      min-width: 0;
    }
    .perfil-brandimg {
      display: block;
      max-width: min(100%, 280px);
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 16px rgba(99,102,241,.25));
    }
    .perfil-brandline {
      margin-top: 6px;
      color: #cbd5e1;
      font-size: .95rem;
      letter-spacing: .03em;
    }
    .perfil-nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .perfil-nav a {
      text-decoration: none;
      color: #fff;
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid rgba(96,165,250,.28);
      background: rgba(15,23,42,.72);
      font-weight: 800;
    }
    .perfil-card {
      padding: 28px;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, .8fr);
      gap: 22px;
      align-items: stretch;
    }
    .perfil-hero {
      display: grid;
      gap: 14px;
    }
    .perfil-chip {
      display: inline-flex;
      width: fit-content;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(250,204,21,.26);
      background: rgba(127,29,29,.18);
      color: #fcd34d;
      font-weight: 800;
      font-size: .88rem;
      letter-spacing: .04em;
    }
    .perfil-title {
      font-size: clamp(2rem, 5vw, 3.1rem);
      line-height: 1.02;
      letter-spacing: -.03em;
    }
    .perfil-status {
      color: #cbd5e1;
      font-size: 1rem;
      max-width: 54ch;
    }
    .perfil-highlight {
      border-radius: 28px;
      padding: 20px;
      border: 1px solid rgba(96,165,250,.18);
      background:
        radial-gradient(circle at top right, rgba(59,130,246,.18), transparent 30%),
        linear-gradient(180deg, rgba(2,6,23,.82), rgba(15,23,42,.72));
      display: grid;
      gap: 14px;
      align-content: center;
      text-align: center;
    }
    .perfil-highlight img {
      width: 124px;
      height: 124px;
      border-radius: 999px;
      object-fit: cover;
      margin: 0 auto;
      border: 3px solid rgba(239,68,68,.82);
      box-shadow: 0 0 26px rgba(239,68,68,.22);
    }
    .perfil-highlight strong {
      font-size: 1.1rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #f8fafc;
    }
    .perfil-highlight p {
      color: #cbd5e1;
      font-size: .96rem;
    }
    .perfil-panel {
      padding: 22px;
      display: grid;
      gap: 16px;
    }
    .perfil-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .perfil-item {
      padding: 16px 18px;
      border-radius: 22px;
      background: rgba(15,23,42,.70);
      border: 1px solid rgba(96,165,250,.16);
      min-width: 0;
    }
    .perfil-item span {
      display: block;
      font-size: 12px;
      color: #93c5fd;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: .10em;
    }
    .perfil-item strong {
      display: block;
      color: #f8fafc;
      font-size: 15px;
      word-break: break-word;
    }
    .perfil-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .perfil-link, .perfil-btn {
      border: 0;
      border-radius: 999px;
      padding: 14px 20px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: transform .18s ease, opacity .18s ease, box-shadow .18s ease;
    }
    .perfil-link {
      color: #fff;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      box-shadow: 0 10px 22px rgba(59,130,246,.18);
    }
    .perfil-btn {
      color: #fff;
      background: linear-gradient(135deg, #dc2626, #ea580c);
      box-shadow: 0 10px 22px rgba(220,38,38,.18);
    }
    .perfil-link:hover, .perfil-btn:hover {
      transform: translateY(-1px);
      opacity: .96;
    }
    @media (max-width: 860px) {
      .perfil-topbar,
      .perfil-card {
        border-radius: 24px;
      }
      .perfil-topbar,
      .perfil-card {
        grid-template-columns: 1fr;
      }
      .perfil-topbar {
        flex-direction: column;
        align-items: stretch;
      }
      .perfil-nav {
        justify-content: stretch;
      }
      .perfil-nav a {
        text-align: center;
        flex: 1 1 160px;
      }
      .perfil-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="perfil-shell">
    <header class="perfil-topbar">
      <div class="perfil-brandbox">
        <img class="perfil-logo" src="/logosrevis.png" alt="LUFFY LUXE STORE" />
        <div class="perfil-brandtext">
          <img class="perfil-brandimg" src="/generated_textX.png" alt="LUFFY LUXE STORE" />
          <p class="perfil-brandline">Tu cuenta ya forma parte del barco.</p>
        </div>
      </div>
      <nav class="perfil-nav">
        <a href="/">Inicio</a>
        <a href="/productos">Productos</a>
      </nav>
    </header>

    <section class="perfil-card">
      <div class="perfil-hero">
        <span class="perfil-chip">Mi cuenta</span>
        <h1 class="perfil-title">Perfil de usuario</h1>
        <p class="perfil-status" id="profileStatus">Cargando sesión...</p>
      </div>
      <aside class="perfil-highlight">
        <img src="/logosrevis.png" alt="LUFFY LUXE STORE" />
        <strong>LUFFY LUXE STORE</strong>
        <p>Accede a tu cuenta, revisa tu sesión y entra al catálogo limpio cuando lo volvamos a activar.</p>
      </aside>
    </section>

    <section class="perfil-panel">
      <div class="perfil-grid">
        <article class="perfil-item">
          <span>Nombre</span>
          <strong id="profileName">-</strong>
        </article>
        <article class="perfil-item">
          <span>Correo</span>
          <strong id="profileEmail">-</strong>
        </article>
        <article class="perfil-item">
          <span>Estado</span>
          <strong id="profileState">Validando acceso</strong>
        </article>
      </div>

      <div class="perfil-actions">
        <a class="perfil-link" href="/productos">Ir a productos</a>
        <button class="perfil-btn" id="logoutBtn" type="button">Cerrar sesión</button>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var statusEl = document.getElementById("profileStatus");
      var nameEl = document.getElementById("profileName");
      var emailEl = document.getElementById("profileEmail");
      var stateEl = document.getElementById("profileState");
      var logoutBtn = document.getElementById("logoutBtn");

      function paintUser(user) {
        var nombre = (user && (user.nombre || user.email)) || "Mi cuenta";
        var email = (user && user.email) || "Sin correo";
        nameEl.textContent = nombre;
        emailEl.textContent = email;
        stateEl.textContent = "Sesión activa";
        statusEl.textContent = "Tu sesión está lista.";
      }

      function readBootstrapUser() {
        try {
          var raw = sessionStorage.getItem("__LUFFY_LOGIN_BOOTSTRAP__");
          if (!raw) return null;
          var data = JSON.parse(raw);
          if (!data || !data.user || !data.ts || (Date.now() - data.ts) > 600000) return null;
          return data.user;
        } catch (_) {
          return null;
        }
      }

      var bootstrapUser = readBootstrapUser();
      if (bootstrapUser) paintUser(bootstrapUser);

      var controller = new AbortController();
      var timeoutId = setTimeout(function () { controller.abort(); }, 15000);

      fetch("/api/me", { credentials: "include", signal: controller.signal })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data && data.authed && data.user) {
            sessionStorage.removeItem("__LUFFY_LOGIN_BOOTSTRAP__");
            paintUser(data.user);
          } else {
            location.href = "/login";
          }
        })
        .catch(function () {
          if (!bootstrapUser) {
            statusEl.textContent = "No se pudo validar la sesión.";
            stateEl.textContent = "Intenta otra vez";
          }
        })
        .finally(function () {
          clearTimeout(timeoutId);
        });

      logoutBtn.addEventListener("click", async function () {
        logoutBtn.disabled = true;
        logoutBtn.textContent = "Saliendo...";
        try {
          await fetch("/secure/logout", { method: "POST", credentials: "include" });
        } catch (_) {}
        try { sessionStorage.removeItem("__LUFFY_LOGIN_BOOTSTRAP__"); } catch (_) {}
        location.href = "/google";
      });
    })();
  </script>
</body>
</html>
