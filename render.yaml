services:
  - type: web
    name: luffy
    runtime: node
    repo: https://github.com/VHASH173/luffy.git
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: JWT_SECRET
        generateValue: true
      # Firebase: Rellena estas 4 desde el panel Environment Variables -> Add from .env
      # (Usa el bloque que te pasé, ya está listo para pegar)
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
