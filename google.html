<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Ingresar a LUFFY LUXE STORE con Google"/>
<title>Ingresar · LUFFY LUXE STORE</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    color: #f8fafc;
    background:
      radial-gradient(circle at 0% 0%, rgba(239,68,68,0.30), transparent 45%),
      radial-gradient(circle at 100% 30%, rgba(250,204,21,0.22), transparent 45%),
      linear-gradient(180deg, #0b1020 0%, #020617 55%, #000 100%);
  }

  .app {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* =========== UNA SOLA TARJETA CENTRADA (SIN HERO / SIN COLUMNAS) =========== */
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }
  .brand img {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    object-fit: contain;
    background: #0b1020;
    border: 1px solid #ffffff1a;
  }
  .brand b {
    font-size: 22px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: linear-gradient(90deg, #ef4444, #facc15);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: linear-gradient(180deg, rgba(15,23,42,0.76), rgba(2,6,23,0.82));
    border: 1px solid #6366f133;
    border-radius: 26px;
    padding: 34px 30px 28px;
    box-shadow: 0 30px 80px #02061799, inset 0 1px #ffffff0a;
  }
  .title {
    margin: 6px 0 6px;
    font-size: 40px;
    font-weight: 900;
    color: #f8fafc;
    line-height: 1.02;
  }
  .subtitle {
    margin: 0 0 22px;
    font-size: 14px;
    color: #cbd5e1;
  }
  .googleBox {
    background: linear-gradient(180deg, rgba(168,85,247,0.14), rgba(56,189,248,0.08));
    border: 1px solid rgba(168,85,247,0.28);
    border-radius: 18px;
    padding: 18px 14px 16px;
  }
  #googleSignInBtn {
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #googleAuthMsg {
    margin: 10px 0 0;
    text-align: center;
    font-size: 12px;
    color: #dbeafe;
  }
  #contener_kik_lop {
    display: none;
    text-align: center;
    color: #a7f3d0;
    font-size: 13px;
    margin-top: 10px;
  }
  .fine {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 18px;
    font-size: 12px;
    color: #94a3b8;
    gap: 6px;
  }
  .fine a {
    color: #86efac;
    text-decoration: none;
  }
  .fine a:hover { text-decoration: underline; }

  @media (max-width: 899px) {
    .title { font-size: 34px; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="card">
      <div class="brand">
        <img src="/logosrevis.png" alt="LUFFY LUXE STORE" onerror="this.style.display='none'"/>
        <b>LUFFY LUXE STORE</b>
      </div>
      <h1 class="title">Entra con Google</h1>
      <p class="subtitle">Un clic y listo.</p>

      <div class="googleBox">
        <div id="googleSignInBtn"></div>
        <p id="googleAuthMsg">Cargando Google…</p>
        <div id="contener_kik_lop">Procesando acceso…</div>
      </div>

      <div class="fine">
        <a href="/">Volver al inicio</a>
      </div>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/auth-lite.js"></script>
</body>
</html>
