<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Ingresar a LUFFY LUXE STORE con Google"/>
<title>Ingresar · LUFFY LUXE STORE</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow-x: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    color: #f8fafc;
    background:
      radial-gradient(circle at 0% 0%, rgba(239,68,68,0.26), transparent 48%),
      radial-gradient(circle at 100% 30%, rgba(250,204,21,0.20), transparent 48%),
      linear-gradient(180deg, #0b1020 0%, #020617 55%, #000 100%);
  }

  /* =========== 1 SOLA TARJETA CENTRADA (tu diseño de las capturas) =========== */
  .app {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(18px, 4.5vw, 34px) clamp(14px, 4vw, 28px);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
  }
  .brand img {
    width: clamp(46px, 8vw, 62px);
    height: clamp(46px, 8vw, 62px);
    border-radius: 999px;
    object-fit: cover;
    background: #0b1020;
    border: 1px solid #ffffff1a;
    box-shadow: 0 0 0 1px #ffffff0d, 0 10px 24px #02061755;
  }
  .brand b {
    font-size: clamp(17px, 2.8vw, 22px);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: linear-gradient(90deg, #ef4444 0%, #f97316 45%, #facc15 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    white-space: nowrap;
    font-weight: 900;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: linear-gradient(180deg, rgba(15,23,42,0.74), rgba(2,6,23,0.88));
    border: 1px solid #6366f133;
    border-radius: 26px;
    padding: clamp(24px, 4.5vw, 36px) clamp(20px, 4vw, 34px) clamp(20px, 4vw, 30px);
    box-shadow: 0 30px 90px #02061788, inset 0 1px #ffffff0a;
  }
  .title {
    margin: 2px 0 8px;
    font-size: clamp(28px, 6vw, 44px);
    font-weight: 900;
    color: #f8fafc;
    line-height: 1.05;
    overflow-wrap: anywhere;
  }
  .subtitle {
    margin: 0 0 22px;
    font-size: clamp(13px, 2.3vw, 15px);
    color: #cbd5e1;
    line-height: 1.6;
    overflow-wrap: anywhere;
  }
  .googleBox {
    background: linear-gradient(180deg, rgba(168,85,247,0.14), rgba(56,189,248,0.08));
    border: 1px solid rgba(168,85,247,0.26);
    border-radius: 22px;
    padding: clamp(16px, 3vw, 20px) clamp(14px, 2.8vw, 18px) clamp(14px, 2.6vw, 18px);
  }
  #googleSignInBtn {
    min-height: 54px;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #googleAuthMsg {
    margin: 12px 0 0;
    text-align: center;
    font-size: clamp(12px, 2.1vw, 13px);
    color: #dbeafe;
    line-height: 1.55;
    overflow-wrap: anywhere;
  }
  #contener_kik_lop {
    display: none;
    text-align: center;
    color: #a7f3d0;
    font-size: 13px;
    margin-top: 10px;
    overflow-wrap: anywhere;
  }
  .fine {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 20px;
    font-size: clamp(12px, 2.1vw, 13px);
    color: #94a3b8;
    gap: 8px;
    text-align: center;
    flex-wrap: wrap;
  }
  .fine a {
    color: #86efac;
    text-decoration: none;
  }
  .fine a:hover { text-decoration: underline; }

  /* =========== SIN HERO LATERAL / SIN 2 COLUMNAS (tu diseño de las capturas) =========== */
  .right {
    display: none !important;
  }
  .right::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(135deg, #ffffff07 0 1px, transparent 1px 18px);
    pointer-events: none;
  }
  .hero {
    position: relative;
    z-index: 2;
    min-height: 100%;
    border-radius: 26px;
    padding: clamp(22px, 3vw, 34px) clamp(20px, 2.8vw, 32px);
    border: 1px solid #ffffff1a;
    background:
      radial-gradient(circle at 70% 30%, rgba(239,68,68,0.32), transparent 40%),
      radial-gradient(circle at 30% 80%, rgba(250,204,21,0.25), transparent 42%),
      linear-gradient(180deg, #111827d4, #020617e0);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 22px;
  }
  .heroBadge {
    width: fit-content;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: clamp(11.5px, 1.6vw, 12.5px);
    color: #fde68a;
    background: rgba(250, 204, 21, 0.12);
    border: 1px solid rgba(250, 204, 21, 0.32);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .hero h2 {
    margin: 18px 0 10px;
    font-size: clamp(30px, 5.2vw, 52px);
    line-height: 1.02;
    font-weight: 900;
    overflow-wrap: anywhere;
  }
  .hero p {
    margin: 0;
    max-width: 560px;
    font-size: clamp(13px, 1.9vw, 16px);
    color: #dbeafe;
    line-height: 1.6;
    overflow-wrap: anywhere;
  }
  .hero .pillRow {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 22px;
  }
  .hero .pill {
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid #ffffff1f;
    background: #ffffff0d;
    font-size: clamp(11.5px, 1.6vw, 12.5px);
    color: #e0f2fe;
    white-space: nowrap;
  }
  .heroStripe {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 26px;
  }
  .heroStripe .box {
    border-radius: 16px;
    padding: clamp(12px, 1.8vw, 14px);
    background: #ffffff0a;
    border: 1px solid #ffffff17;
    min-width: 0;
  }
  .heroStripe .box b {
    display: block;
    font-size: clamp(18px, 2.6vw, 22px);
    color: #fde68a;
    margin-bottom: 4px;
  }
  .heroStripe .box span {
    font-size: clamp(11px, 1.5vw, 12px);
    color: #cbd5e1;
    overflow-wrap: anywhere;
  }
  .heroFooter {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 22px;
    color: #cbd5e1;
    font-size: clamp(11px, 1.5vw, 12px);
    gap: 12px;
    flex-wrap: wrap;
  }

  @media (max-width: 520px) {
    .brand img { width: 46px; height: 46px; }
    .brand b { font-size: 17px; letter-spacing: 0.06em; }
    .title { font-size: 30px; }
    .subtitle { font-size: 13px; }
    #googleAuthMsg { font-size: 12px; }
    .fine { font-size: 12px; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="card">
      <div class="brand">
        <img src="/logosrevis.png" alt="LUFFY LUXE STORE" onerror="this.style.display='none'"/>
        <b>LUFFY LUXE STORE</b>
      </div>
      <h1 class="title">Entra con Google</h1>
      <p class="subtitle">Un clic y listo. Sin códigos ni formularios que se cuelguen.</p>

      <div class="googleBox">
        <div id="googleSignInBtn"></div>
        <p id="googleAuthMsg">Puedes entrar con Google en un clic.</p>
        <div id="contener_kik_lop">Procesando acceso…</div>
      </div>

      <div class="fine">
        <a href="/">Volver al inicio</a>
      </div>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/auth-lite.js"></script>
</body>
</html>
